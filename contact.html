<!DOCTYPE html>
<html>

<head>
    <title>homepage</title>
    <link rel="stylesheet" href="css/style.css" />
    <script src="https://kit.fontawesome.com/1141bedca2.js" crossorigin="anonymous"></script>
</head>

<body>

    <header class="container-header">

        <a href="index.html" class="headertextwhite">Pink
            <span class="headertextpink">Goose</span> </a>

        <div class="headerbuttons-container">
            <a href="index.html" class="headerbuttons">Home</a>
            <a href="learn.html" class="headerbuttons">learn</a>
            <a href="about.html" class="headerbuttons">about</a>
            <a href="contact.html" class="headerbuttons">contact</a>
        </div>

        <a class="login-button" href="contact.html">login</a>

    </header>

    <section class="second-body">
        <!-- ============================================================================================ -->
        <section class="primary-container">

            <div class="sectioned-text">What's your GOOSE idea?</div>
            <div class="big-description-text">Let’s chat and see how we can help</div>

            <div class="chat-container">

                <div class="chat-box backroundcolor-yellow yellow-shadow">
                    <div class="chat-backround-yellow">
                        <img class="chat-pictures" src="images/icons/plane.png" alt="plane">
                    </div>

                    <div class="chat-info-box">
                        <p class="chat-text">Telegram</p>
                        <p class="chat-small-text">@superdao_team</p>
                    </div>

                </div>

                <div class="chat-box backroundcolor-pink pink-shadow">
                    <div class="chat-backround-pink">
                        <img class="chat-pictures" src="images/icons/monkeytail.png" alt="monkeytail">
                    </div>

                    <div class="chat-info-box">
                        <p class="chat-text">Email</p>
                        <p class="chat-small-text">hello@superdao.co</p>
                    </div>

                </div>
            </div>
        </section>
        <!-- email form -->
        <!-- ===================================================================================================== -->
        <section class="email-form-container">
            <div class="email-form-box secondary-backround">

                <div class="email-text">Send a post Goose</div>

                <form class="form-container">
                    <input class="form secondary-backround" placeholder="your email" type="email"
                        id="email" name="email" required>

                    <input class="form secondary-backround" placeholder="your Name" type="text" id="name" name="name" required>

                    <textarea class="form secondary-backround" placeholder="your message" name="message" id="message"
                        rows="6"></textarea>

                    <select class="form secondary-backround pointer" name="selection-box" id="select">
                        <option value="color">Red</option>
                        <option value="color">White</option>
                        <option value="color">Blue</option>
                        <option value="color">Black</option>
                    </select>

                    <div class="email-button-container">
                        <input class="subscribe-button pointer button-padding" type="submit" value="Send">
                    </div>

                </form>

            </div>
        </section>

    </section>
    <!-- footer -->
    <!-- ====================================================================================================================== -->
    <footer>

        <section class="footer">


            <div class="footer-links-container">
                <a class="footer-text">About</a>
                <a class="footer-text">Jobs</a>
                <a class="footer-text">Legal</a>
            </div>


            <div class="footer-buttons">
                <i class=" pointer fa-brands fa-twitter medialinks"></i>
                <i class=" pointer fa-brands fa-instagram medialinks"></i>
                <i class=" pointer fa-brands fa-youtube medialinks"></i>
                <i class=" pointer fa-brands fa-discord medialinks"></i>
            </div>

        </section>

    </footer>
</body>

</html>
